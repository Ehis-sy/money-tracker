name: Build Android app

# Builds the Money Tracker app (MoneyTracker.apk) and publishes it as a download on the Releases page.
# Runs by itself whenever version.json changes, or by hand from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'version.json' ]

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the signing key is set up
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_B64 and KEYSTORE_PASSWORD secrets first (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare the app files
        run: python3 android_setup.py web

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set version, signing, icons
        run: python3 android_setup.py android

      - name: Build the signed APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode --ignore-garbage > android/app/release.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../MoneyTracker.apk

      - name: Read version
        id: v
        run: echo "version=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Money Tracker ${{ steps.v.outputs.version }}
          body: |
            Download **MoneyTracker.apk** below and open it on your Android phone to install or update.
            Updating keeps your entries.
          files: MoneyTracker.apk
          make_latest: true
