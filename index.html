function forecastCard() {
  const f = forecast(); if (!f) return '';
  const warn = f.firstNeg ? `<p class="fcwarn">${ICON.over}<span>You could run short around <b>${fmtDM(f.firstNeg.date)}</b>, by up to <b class="num">${naira(-f.low.v)}</b>.</span></p>`
    : f.low.v < f.perDay * 5 && f.low.v < f.start ? `<p class="fcwarn near">${ICON.near}<span>It gets tight around <b>${fmtDM(f.low.date)}</b>: lowest <b class="num">${naira(f.low.v)}</b>.</span></p>` : '';
  return `<section class="card fc"><button class="cardbtn" data-act="openForecast" aria-label="Open the cash-flow forecast">
    <div class="card-head" style="margin-bottom:4px"><h2>Cash-flow forecast</h2><small>to ${fmtDM(f.end)} ›</small></div>
    <div class="kpis2"><div><span>Cash now</span><b class="num">${naira(f.start)}</b></div><div><span>Lowest point</span><b class="num ${f.low.v < 0 ? 'neg' : ''}">${naira(f.low.v)}</b></div></div>
    <div style="margin:10px 0 2px">${lineChart(f.pts, 320, 64, { aria: 'Projected cash until ' + fmtDM(f.end), marks: f.events.filter(e => e.payday).map(e => ({ date: e.date, color: 'var(--good)' })) })}</div>
    ${warn}</button></section>`;
}
function openForecast() {
  const f = forecast(); if (!f) return;
  const byDate = {}; f.events.forEach(e => { (byDate[e.date] ||= []).push(e); });
  const ev = Object.keys(byDate).sort().map(d => { const p = f.pts.find(x => x.date === d); return byDate[d].map(e => `<div class="item"><div class="mid"><div class="t1">${esc(e.label)}</div><div class="t2">${fmtDay(d)} · balance after: <span class="num ${p && p.v < 0 ? 'neg' : ''}">${naira(p ? p.v : 0)}</span></div></div><div class="amt num ${e.v > 0 ? 'inc' : ''}">${e.v > 0 ? '+' : '−'}${naira(Math.abs(e.v))}</div></div>`).join(''); }).join('');
  openSheet(`<div class="phead"><h3>Cash-flow forecast</h3><button class="x" data-close>×</button></div>
    <p class="note" style="margin-top:0">Money in your spending accounts (not savings) from today to ${fmtShort(f.end)}, if things go as usual.</p>
    <div class="fcbig">${lineChart(f.pts, 340, 170, { axis: true, aria: 'Projected cash balance by day', marks: [...f.events.filter(e => e.payday).map(e => ({ date: e.date, color: 'var(--good)' })), { date: f.low.date, color: f.low.v < 0 ? 'var(--crit)' : 'var(--warn)' }] })}</div>
    ${f.firstNeg ? `<p class="fcwarn">${ICON.over}<span>At this rate you run short on <b>${fmtDay(f.firstNeg.date)}</b>, and the gap reaches <b class="num">${naira(-f.low.v)}</b> by ${fmtDM(f.low.date)}. Spending about <b class="num">${naira(Math.ceil(-f.low.v / Math.max(1, daysBetween(todayISO(), f.low.date))))}</b> less a day, or moving bills after payday, would close it.</span></p>`
      : `<p class="note"><span class="st ok">${ICON.ok} No shortfall expected.</span> Lowest point: <b class="num">${naira(f.low.v)}</b> on ${fmtDM(f.low.date)}.</p>`}
    ${(() => { const c = S.setup.accounts.filter(a => isCash(a.name)), n = c.filter(a => !(S.prefs.recon || {})[a.name]).length; return n ? `<p class="note">${n} of your ${c.length} spending accounts haven’t had a <b>balance check</b>, so money that was in them before you started tracking isn’t counted and the forecast may look lower than it is. Do a check from Accounts.</p>` : ''; })()}
    <div class="kv"><span>Cash now</span><span class="num"><b>${naira(f.start)}</b></span></div>
    <div class="kv"><span>Usual day-to-day spending</span><span class="num">${naira(f.perDay)} a day</span></div>
    ${f.np ? `<div class="kv"><span>Next payday</span><span class="num">${fmtDM(f.np)} · ${f.pay.v >= 0 ? '+' : '−'}${naira(Math.abs(f.pay.v))} to spending accounts</span></div>` : ''}
    <div class="kv"><span>Expected on ${fmtDM(f.end)}</span><span class="num"><b>${naira(f.final)}</b></span></div>
    <div class="day">What’s coming up</div>${ev ? `<div class="list">${ev}</div>` : '<p class="note">No bills or paydays in this period.</p>'}
    <details style="margin-top:10px"><summary>How this is worked out</summary><ol class="steps">
      <li>Starts from what your spending accounts hold today (using your balance checks where you’ve done them).</li>
      <li>Takes off your usual day-to-day spending, from the last 30 days (bills and payday entries left out).</li>
      <li>Takes off each bill on its due date, and adds payday using your payday list${f.pay && !f.pay.fromList ? ' (empty, so your last payday’s entries are used)' : ''}.</li>
      <li>Savings, money lent and money borrowed aren’t counted as cash.</li></ol></details>`);
}

/* Savings goals */
const goals = () => (S.prefs.goals ||= []);
function goalSaved(g) { if (g.account && S.setup.accounts.some(a => a.name === g.account)) return Math.max(0, balancesAt(todayISO())[g.account] || 0); return +g.saved || 0; }
function monthsLeft(date) { if (!date) return null; const t = todayISO(); if (date <= t) return 0; const [y1, m1, d1] = isoParts(t), [y2, m2, d2] = isoParts(date); return Math.max(1, (y2 - y1) * 12 + (m2 - m1) - (d2 < d1 ? 1 : 0)); }
function goalInfo(g) {
  const saved = goalSaved(g), target = +g.target || 0, left = Math.max(0, target - saved), pct = target ? Math.min(1, saved / target) : 0, ml = monthsLeft(g.date);
  const perMonth = left > 0 && ml ? Math.ceil(left / ml) : 0;
  return { saved, target, left, pct, ml, perMonth, done: left <= 0, late: g.date && g.date < todayISO() && left > 0 };
}
function goalsSection() {
  const list = goals();
  const row = g => { const i = goalInfo(g); return `<button class="goal" data-act="openGoal" data-id="${g.id}">
    <div class="l1"><b>${esc(g.name)}</b><span class="num">${naira(i.saved)} <span style="color:var(--ink-2)">of ${naira(i.target)}</span></span></div>
    <div class="track"><div class="fill" style="width:${Math.max(i.pct * 100, i.pct > 0 ? 2 : 0)}%;background:${i.done ? 'var(--good)' : i.late ? 'var(--crit)' : 'var(--bar)'}"></div></div>
    <div class="l2"><span>${i.done ? '<span class="st ok">' + ICON.ok + ' Reached</span>' : g.date ? (i.late ? 'Target date passed' : 'By ' + fmtShort(g.date)) : 'No target date'}</span><span class="num">${i.done ? '' : i.perMonth ? naira(i.perMonth) + ' a month' : naira(i.left) + ' to go'}</span></div></button>`; };
  return `<section class="card"><div class="card-head"><h2>Savings goals</h2><small>${list.length || ''}</small></div>
    ${list.length ? list.map(row).join('') : '<p class="note" style="margin-top:0">Saving for rent, a laptop or an emergency fund? Set a target and date, and see how much to put away each month.</p>'}
    <button class="btn sec" style="margin-top:10px" data-act="newGoal">Add a goal</button></section>`;
}
function openGoalForm(g) {
  const v = g || { name: '', target: '', date: '', account: '', saved: 0 }, accts = S.setup.accounts.filter(a => !['Lent', 'Borrowed'].includes(a.type));
  sheetCtx = { goalForm: true, id: g ? g.id : null, confirmDel: false };
  openSheet(`<div class="phead"><h3>${g ? 'Edit goal' : 'New savings goal'}</h3><button class="x" data-close>×</button></div>
    <div class="fld"><label for="gl-name">What are you saving for?</label><input class="in" id="gl-name" maxlength="40" value="${esc(v.name)}" placeholder="e.g. Emergency fund"></div>
    <div class="fld"><label for="gl-target">Target amount</label><input class="in" id="gl-target" inputmode="decimal" data-money value="${v.target ? NF.format(v.target) : ''}"></div>
    <div class="fld"><label for="gl-date">Target date (optional)</label><input type="date" class="in" id="gl-date" value="${v.date || ''}" min="${todayISO()}"></div>
    <div class="fld"><label for="gl-acc">Track it with</label><select class="in" id="gl-acc"><option value="">Amounts I add myself</option>${accts.map(a => `<option ${a.name === v.account ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      <div class="hint">Pick a savings account and its balance is the amount saved.</div></div>
    <div class="fld" id="gl-savedf" ${v.account ? 'hidden' : ''}><label for="gl-saved">Saved so far</label><input class="in" id="gl-saved" inputmode="decimal" data-money value="${v.saved ? NF.format(v.saved) : ''}" placeholder="0"></div>
    <div class="err" id="gl-err"></div><button class="btn" data-act="saveGoal">Save goal</button>
    ${g ? '<button class="btn danger" data-act="delGoal">Delete goal</button>' : ''}`, sheetCtx);
}
function saveGoal() {
  const err = m => { $('#gl-err').textContent = m; }, name = $('#gl-name').value.trim(), target = readAmount($('#gl-target').value);
  if (!name) return err('Give the goal a name.'); if (!(target > 0)) return err('Enter a target above zero.');
  const g = { id: sheetCtx.id || newId(), name, target, date: $('#gl-date').value || '', account: $('#gl-acc').value, saved: Math.max(0, readAmount($('#gl-saved').value) || 0) };
  const i = goals().findIndex(x => x.id === g.id); if (i >= 0) goals()[i] = { ...goals()[i], ...g }; else goals().push(g);
  saveCache(); closeSheet(); render(); toast('Goal saved');
}
function openGoal(id) {
  const g = goals().find(x => x.id === id); if (!g) return; const i = goalInfo(g);
  sheetCtx = { goalView: true, id };
  const onList = tpl().some(l => l.goalId === g.id);
  openSheet(`<div class="phead"><h3>${esc(g.name)}</h3><button class="x" data-close>×</button></div>
    <div class="track" style="height:12px;margin:2px 0 12px"><div class="fill" style="width:${i.pct * 100}%;background:${i.done ? 'var(--good)' : 'var(--bar)'}"></div></div>
    <div class="kv"><span>Saved</span><span class="num"><b>${naira(i.saved)}</b> · ${Math.round(i.pct * 100)}%</span></div>
    <div class="kv"><span>Target</span><span class="num">${naira(i.target)}${g.date ? ' by ' + fmtShort(g.date) : ''}</span></div>
    <div class="kv"><span>Still to save</span><span class="num">${naira(i.left)}</span></div>
    ${i.perMonth ? `<div class="kv"><span>Needed each month</span><span class="num"><b>${naira(i.perMonth)}</b> for ${i.ml} month${i.ml > 1 ? 's' : ''}</span></div>` : ''}
    <p class="note">${g.account ? 'Tracked with your <b>' + esc(g.account) + '</b> balance.' : 'You update the amount saved yourself.'}</p>
    ${!g.account && !i.done ? `<div class="addrow"><input class="in" id="gl-add" inputmode="decimal" data-money placeholder="Amount you’ve put aside"><button data-act="goalAdd">Add</button></div>` : ''}
    ${i.perMonth && !i.done ? `<button class="btn" data-act="goalToPayday">${onList ? 'Update' : 'Add'} “save ${naira(i.perMonth)} a month” on my payday list</button>` : ''}
    <button class="btn sec" data-act="editGoal" data-id="${g.id}">Edit goal</button>`, sheetCtx);
}
function goalToPayday() {
  const g = goals().find(x => x.id === sheetCtx.id), i = goalInfo(g), existing = tpl().find(l => l.goalId === g.id);
  if (existing) { openTplItem({ ...existing, amount: i.perMonth }, 'settings'); return; }
  const cash = S.setup.accounts.filter(a => isCash(a.name)), sav = S.setup.accounts.filter(a => a.type === 'Savings');
  const from = (tpl().find(l => l.kind === 'income') || {}).account || (cash[0] || {}).name || '', to = g.account || (sav[0] || {}).name || '';
  openTplItem({ kind: 'transfers', from, to: to !== from ? to : '', desc: 'Save for ' + g.name, amount: i.perMonth, fee: 0, goalId: g.id }, 'settings');
  toast('Check the accounts, then tap Save', 3000);
}
/* Net worth, per currency */
const assets = () => (S.prefs.assets ||= []);
function netWorthAt(date) {
  const b = balancesAt(date); let acc = 0; for (const n in b) acc += b[n];
  let owed = 0, owe = 0;
  for (const d of debts()) { if (d.account || (date && d.date > date)) continue; const paid = (d.payments || []).filter(p => !p.account && (!date || !p.date || p.date <= date)).reduce((s, p) => s + (+p.amount || 0), 0); const forgiven = d.settled && debtPaid(d) < d.amount, left = forgiven ? 0 : Math.max(0, d.amount - paid); if (d.dir === 'lent') owed += left; else owe += left; }
  const other = assets().reduce((s, a) => s + (a.kind === 'liability' ? -1 : 1) * (+a.value || 0), 0);
  return { acc, owed, owe, other, total: acc + owed - owe + other };
}
function netWorthTrend() {
  const firstMonth = Object.keys(S.months).sort()[0]; if (!firstMonth) return [];
  const t = todayISO(), out = []; let [y, m] = firstMonth.split('-').map(Number);
  const months = []; while (true) { const end = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); if (end >= t) { months.push(t); break; } months.push(end); m++; if (m > 12) { m = 1; y++; } }
  for (const d of months.slice(-12)) out.push({ date: d, v: netWorthAt(d).total });
  return out;
}
function netWorthCard() {
  const nw = netWorthAt(todayISO()), tr = netWorthTrend(), prev = tr.length > 1 ? tr[tr.length - 2].v : null;
  const ch = prev == null ? '' : `<span class="dl ${nw.total >= prev ? 'good' : 'bad'}">${nw.total >= prev ? '▲' : '▼'} ${naira(Math.abs(nw.total - prev))} since ${fmtDM(tr[tr.length - 2].date)}</span>`;
  return `<section class="card"><button class="cardbtn" data-act="openNetWorth" aria-label="Open net worth">
    <div class="card-head"><h2>Net worth · ${esc(CUR.code)}</h2><small>details ›</small></div>
    <div class="big num" style="font-size:30px;font-weight:800;letter-spacing:-.02em">${naira(nw.total)}</div>
    <div class="sub" style="font-size:13px;color:var(--ink-2)">What you own minus what you owe, in ${esc(CUR.code)} only. ${ch}</div>
    ${tr.length > 1 ? `<div style="margin-top:10px">${lineChart(tr, 320, 60, { aria: 'Net worth by month' })}</div>` : ''}</button></section>`;
}
function openNetWorth() {
  const nw = netWorthAt(todayISO()), tr = netWorthTrend(), b = balancesAt(todayISO());
  const acctRows = S.setup.accounts.map(a => `<div class="kv"><span>${esc(a.name)}<small style="display:block;color:var(--muted);font-size:12px">${esc(a.type || '')}</small></span><span class="num ${b[a.name] < 0 ? 'neg' : ''}">${naira(b[a.name] || 0)}</span></div>`).join('');
  const other = assets().map(a => `<div class="item"><div class="mid"><div class="t1">${esc(a.name)}</div><div class="t2">${a.kind === 'liability' ? 'Something you owe' : 'Something you own'}</div></div><span class="amt num ${a.kind === 'liability' ? 'neg' : ''}">${a.kind === 'liability' ? '−' : ''}${naira(a.value)}</span><button class="rm" data-act="editAsset" data-id="${a.id}" aria-label="Edit">✎</button></div>`).join('');
  openSheet(`<div class="phead"><h3>Net worth · ${esc(CUR.code)}</h3><button class="x" data-close>×</button></div>
    <div class="big num" style="font-size:32px;font-weight:800">${naira(nw.total)}</div>
    <p class="note" style="margin-top:2px">${esc(CUR.name)} only. Each currency has its own net worth; nothing is converted.</p>
    ${tr.length > 1 ? `<div class="fcbig">${lineChart(tr, 340, 150, { axis: true, aria: 'Net worth at the end of each month', label: p => MON[isoParts(p.date)[1] - 1] })}</div>` : ''}
    <div class="day">Accounts · ${naira(nw.acc)}</div>${acctRows}
    ${nw.owed || nw.owe ? `<div class="day">Lent &amp; borrowed (not linked to an account)</div><div class="kv"><span>Owed to you</span><span class="num">${naira(nw.owed)}</span></div><div class="kv"><span>You owe</span><span class="num neg">−${naira(nw.owe)}</span></div>` : ''}
    <div class="day">Other things you own or owe · ${naira(nw.other)}</div>
    ${other ? `<div class="list">${other}</div>` : '<p class="note" style="margin-top:0">Add land, a car, gold, a pension, or loans like a car loan, so your net worth is complete.</p>'}
    <button class="btn sec" style="margin-top:12px" data-act="newAsset">Add something you own or owe</button>
    <p class="note">Account balances count only what’s been tracked, plus any balance checks you’ve done.</p>`);
}
function openAssetForm(a) {
  const v = a || { name: '', value: '', kind: 'asset' };
  sheetCtx = { assetForm: true, id: a ? a.id : null, kind: v.kind, confirmDel: false };
  const draw = () => openSheet(`<div class="phead"><h3>${a ? 'Edit' : 'Add'} ${sheetCtx.kind === 'liability' ? 'something you owe' : 'something you own'}</h3><button class="x" data-close>×</button></div>
    <div class="seg" style="grid-template-columns:1fr 1fr"><button type="button" class="${sheetCtx.kind === 'asset' ? 'on' : ''}" data-act="assetKind" data-v="asset">I own it</button><button type="button" class="${sheetCtx.kind === 'liability' ? 'on' : ''}" data-act="assetKind" data-v="liability">I owe it</button></div>
    <div class="fld"><label for="as-name">Name</label><input class="in" id="as-name" maxlength="40" value="${esc(v.name)}" placeholder="${sheetCtx.kind === 'liability' ? 'e.g. Car loan' : 'e.g. Land in Ibadan'}"></div>
    <div class="fld"><label for="as-val">${sheetCtx.kind === 'liability' ? 'Amount still owed' : 'What it’s worth today'} (${esc(CUR.code)})</label><input class="in" id="as-val" inputmode="decimal" data-money value="${v.value ? NF.format(v.value) : ''}"></div>
    <div class="err" id="as-err"></div><button class="btn" data-act="saveAsset">Save</button>${a ? '<button class="btn danger" data-act="delAsset">Delete</button>' : ''}`, sheetCtx);
  sheetCtx.draw = () => { v.name = $('#as-name').value; v.value = readAmount($('#as-val').value) || ''; draw(); };
  draw();
}
function saveAsset() {
  const name = $('#as-name').value.trim(), value = readAmount($('#as-val').value);
  if (!name) { $('#as-err').textContent = 'Give it a name.'; return; } if (!(value >= 0)) { $('#as-err').textContent = 'Enter an amount.'; return; }
  const a = { id: sheetCtx.id || newId(), name, value, kind: sheetCtx.kind };
  const i = assets().findIndex(x => x.id === a.id); if (i >= 0) assets()[i] = a; else assets().push(a);
  saveCache(); render(); openNetWorth(); toast('Saved');
}

Store.init();
if (!IS_NATIVE && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
